# ── Iceberg extensions ────────────────────────────────────────────────────────
spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ── Iceberg REST catalog (named "demo") ───────────────────────────────────────
# All Iceberg tables are referenced as:  demo.<namespace>.<table>
#   demo.bronze.orders
#   demo.silver.dim_product
#   demo.gold.fact_orders
spark.sql.catalog.demo                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type                       rest
spark.sql.catalog.demo.uri                        http://iceberg-rest:8181
spark.sql.catalog.demo.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.demo.s3.endpoint                http://minio:9000
spark.sql.catalog.demo.s3.access-key-id           minioadmin
spark.sql.catalog.demo.s3.secret-access-key       minioadmin
spark.sql.catalog.demo.s3.path-style-access       true
spark.sql.catalog.demo.s3.region                  us-east-1
spark.sql.catalog.demo.warehouse                  s3://warehouse/

# ── S3A filesystem (MinIO) ────────────────────────────────────────────────────
spark.hadoop.fs.s3a.endpoint                      http://minio:9000
spark.hadoop.fs.s3a.access.key                    minioadmin
spark.hadoop.fs.s3a.secret.key                    minioadmin
spark.hadoop.fs.s3a.path.style.access             true
spark.hadoop.fs.s3a.impl                          org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled        false
spark.hadoop.fs.s3a.aws.credentials.provider      org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ── AWS region (required by Iceberg S3FileIO / SDK v2 even for MinIO) ────────
spark.driver.extraJavaOptions                     -Daws.region=us-east-1
spark.executor.extraJavaOptions                   -Daws.region=us-east-1

# ── Performance ───────────────────────────────────────────────────────────────
spark.sql.shuffle.partitions                      8
spark.default.parallelism                         8

# ── Cluster sharing ──────────────────────────────────────────────────────────
# The standalone cluster only has 4 total cores (2 workers x 2 cores). Without
# a per-application cap, Spark Standalone lets one application grab every
# available core, which is fine for short batch jobs but fatal for the
# long-running streaming_consumer.py job: it would hold all 4 cores for its
# entire lifetime and starve every batch job submitted afterward (they queue
# forever in WAITING state). Capping each application to 2 cores lets the
# streaming consumer run indefinitely on half the cluster while batch jobs
# (bronze/silver/gold/data_quality/gold_streaming_summary/etc.) still get
# cores to run on the other half.
spark.cores.max                                   2
